<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track income and spending, set monthly budgets by category, and see where your money goes. Built with C# and Blazor." />
    <title>Budget Tracker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b8a3e'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Arial'%3E$%3C/text%3E%3C/svg%3E">
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>
<body>
    <div id="app"><div class="loading">Loading…</div></div>
    <div id="blazor-error-ui">
        Something went wrong. <a href="." class="reload">Reload</a>
    </div>
    <script>
        window.downloadFile = (name, text) => {
            const url = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
            const a = Object.assign(document.createElement('a'), { href: url, download: name });
            a.click();
            URL.revokeObjectURL(url);
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
